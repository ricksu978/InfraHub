name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    uses: ./.github/workflows/template-cd.yml
    with:
      environment_name: dev
      project_name: iac-bicep-demo
      sql_admin_login: sqladmin
    secrets:
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}