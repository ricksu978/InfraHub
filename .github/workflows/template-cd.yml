name: Template CD

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      project_name:
        required: true
        type: string
      sql_admin_login:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.infra.outputs.web_app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure
        id: infra
        shell: pwsh
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          /infra/scripts/deploy.ps1 `
            -ResourceGroupName "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -DeploymentName "github-${{ inputs.environment_name }}-${{ github.run_number }}" `
            -TemplateFile "./infra/main.bicep" `
            -ParameterFile "./infra/main.${{ inputs.environment_name }}.bicepparam" `
            -ProjectName "${{ inputs.project_name }}" `
            -EnvironmentName "${{ inputs.environment_name }}" `
            -Location "${{ vars.AZURE_LOCATION }}" `
            -SqlAdministratorLogin "${{ inputs.sql_admin_login }}"

          "web_app_url=$($deployment.webAppUrl)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "keyvault_name=$($deployment.keyVaultName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sql_server_name=$($deployment.sqlServerName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sql_database_name=$($deployment.sqlDatabaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8